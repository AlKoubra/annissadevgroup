<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnNissa Admin — Connexion</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #080c32;
      background-image:
        radial-gradient(ellipse at 20% 50%, rgba(240,180,41,.07) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 30%, rgba(99,102,241,.08) 0%, transparent 55%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      padding: 20px;
      overflow: hidden;
    }

    canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      background: linear-gradient(160deg, #0d1347 0%, #0f1a5a 100%);
      border: 1px solid rgba(240,180,41,.2);
      border-radius: 24px;
      padding: 52px 44px 44px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 40px 100px rgba(0,0,0,.7), 0 0 0 1px rgba(240,180,41,.05) inset;
      animation: fadeUp .5s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 32px;
    }

    .logo-text .name {
      display: block;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: #f0b429;
      letter-spacing: .5px;
      line-height: 1;
    }

    .logo-text .sub {
      display: block;
      font-size: 10px;
      font-weight: 600;
      color: rgba(255,255,255,.35);
      letter-spacing: 2.5px;
      text-transform: uppercase;
      margin-top: 3px;
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(240,180,41,.3), transparent);
      margin-bottom: 32px;
    }

    h1 {
      text-align: center;
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 6px;
    }

    .subtitle {
      text-align: center;
      font-size: 13px;
      color: #475569;
      margin-bottom: 32px;
    }

    .form-group { margin-bottom: 18px; }

    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: .8px;
      margin-bottom: 8px;
    }

    .input-wrap {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      opacity: .4;
      pointer-events: none;
    }

    input {
      width: 100%;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 12px;
      padding: 14px 16px 14px 42px;
      font-size: 14px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      transition: border-color .2s, background .2s, box-shadow .2s;
      outline: none;
    }

    input:focus {
      border-color: rgba(240,180,41,.5);
      background: rgba(240,180,41,.04);
      box-shadow: 0 0 0 3px rgba(240,180,41,.08);
    }

    input::placeholder { color: #334155; }

    .toggle-pw {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #475569;
      padding: 2px;
      display: flex;
      align-items: center;
      transition: color .2s;
    }
    .toggle-pw:hover { color: #f0b429; }

    .error-box {
      background: rgba(239,68,68,.1);
      border: 1px solid rgba(239,68,68,.3);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 13px;
      color: #fca5a5;
      text-align: center;
      margin-bottom: 18px;
      display: none;
    }

    .btn {
      width: 100%;
      margin-top: 6px;
      background: linear-gradient(135deg, #f0b429, #d4940a);
      color: #0d1347;
      font-weight: 800;
      font-size: 15px;
      padding: 15px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      letter-spacing: .3px;
      transition: opacity .2s, transform .1s, box-shadow .2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:hover { opacity: .92; box-shadow: 0 8px 24px rgba(240,180,41,.3); }
    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    .back {
      display: block;
      text-align: center;
      margin-top: 28px;
      font-size: 13px;
      color: #334155;
      text-decoration: none;
      transition: color .2s;
    }
    .back:hover { color: #f0b429; }

    .lock-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 24px;
    }
    .lock-badge span {
      font-size: 11px;
      color: #334155;
      letter-spacing: .5px;
    }
  </style>
</head>
<body>
<canvas id="c"></canvas>

<div class="card">
  <div class="logo-wrap">
    <svg viewBox="0 0 60 60" fill="none" width="46" height="46">
      <circle cx="30" cy="30" r="28" stroke="#f0b429" stroke-width="2"/>
      <circle cx="30" cy="30" r="20" stroke="#f0b429" stroke-width="1.5"/>
      <circle cx="30" cy="36" r="3" fill="#f0b429"/>
      <path d="M20 28 Q30 20 40 28" stroke="#f0b429" stroke-width="2" fill="none" stroke-linecap="round"/>
      <circle cx="30" cy="8" r="2" fill="#f0b429"/>
      <circle cx="30" cy="52" r="2" fill="#f0b429"/>
      <circle cx="8" cy="30" r="2" fill="#f0b429"/>
      <circle cx="52" cy="30" r="2" fill="#f0b429"/>
    </svg>
    <div class="logo-text">
      <span class="name">AnNissa</span>
      <span class="sub">Dev Group</span>
    </div>
  </div>

  <div class="divider"></div>

  <div class="lock-badge">
    <svg viewBox="0 0 24 24" fill="none" stroke="#334155" stroke-width="2" width="14" height="14"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    <span>ACCÈS SÉCURISÉ</span>
  </div>

  <h1>Connexion Admin</h1>
  <p class="subtitle">Réservé aux administrateurs AnNissa Dev Group</p>

  <div class="error-box" id="err"></div>

  <form id="loginForm">
    <div class="form-group">
      <label>Adresse email</label>
      <div class="input-wrap">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" width="18" height="18"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        <input type="email" id="email" placeholder="Adresse email" required autocomplete="email">
      </div>
    </div>
    <div class="form-group">
      <label>Mot de passe</label>
      <div class="input-wrap">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" width="18" height="18"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
        <button type="button" class="toggle-pw" id="togglePw">
          <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
    <button type="submit" class="btn" id="btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="17" height="17"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      <span>Se connecter</span>
    </button>
  </form>

  <a href="/" class="back">← Retour au site vitrine</a>
</div>

<script>
// Particles
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth; canvas.height = window.innerHeight;
window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
const pts = Array.from({length: 60}, () => ({
  x: Math.random() * canvas.width, y: Math.random() * canvas.height,
  vx: (Math.random()-.5)*.3, vy: (Math.random()-.5)*.3,
  r: Math.random()*1.5+.5, a: Math.random()*.4+.1
}));
(function loop() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  pts.forEach(p => {
    p.x+=p.vx; p.y+=p.vy;
    if(p.x<0||p.x>canvas.width) p.vx*=-1;
    if(p.y<0||p.y>canvas.height) p.vy*=-1;
    ctx.save(); ctx.globalAlpha=p.a; ctx.fillStyle='#f0b429';
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); ctx.restore();
  });
  requestAnimationFrame(loop);
})();

// Toggle password visibility
document.getElementById('togglePw').addEventListener('click', () => {
  const inp = document.getElementById('password');
  inp.type = inp.type === 'password' ? 'text' : 'password';
});

// Login form
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const err = document.getElementById('err');
  err.style.display = 'none';
  btn.disabled = true;
  btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="17" height="17" style="animation:spin 1s linear infinite"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg><span>Connexion...</span>';

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
    });
    if (res.ok) {
      window.location.replace('/admin');
    } else {
      const d = await res.json();
      err.textContent = d.error || 'Email ou mot de passe incorrect';
      err.style.display = 'block';
      btn.disabled = false;
      btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="17" height="17"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg><span>Se connecter</span>';
    }
  } catch {
    err.textContent = 'Erreur réseau. Réessayez.';
    err.style.display = 'block';
    btn.disabled = false;
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="17" height="17"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg><span>Se connecter</span>';
  }
});
</script>
<style>@keyframes spin { to { transform: rotate(360deg); } }</style>
</body>
</html>
