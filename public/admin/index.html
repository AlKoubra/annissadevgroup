<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnNissa Admin</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/admin.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>
<body>

<!-- ===== SIDEBAR ===== -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <a href="/" class="sidebar-logo">
      <svg viewBox="0 0 50 50" fill="none" width="36" height="36">
        <circle cx="25" cy="25" r="23" stroke="#f0b429" stroke-width="2"/>
        <circle cx="25" cy="25" r="16" stroke="#f0b429" stroke-width="1.5"/>
        <circle cx="25" cy="30" r="2.5" fill="#f0b429"/>
        <path d="M16 23 Q25 16 34 23" stroke="#f0b429" stroke-width="2" fill="none" stroke-linecap="round"/>
      </svg>
      <div>
        <span class="logo-name">AnNissa</span>
        <span class="logo-sub">Admin</span>
      </div>
    </a>
    <button class="sidebar-close" id="sidebarClose">✕</button>
  </div>

  <nav class="sidebar-nav">
    <div class="nav-section">
      <span class="nav-section-label">Tableau de bord</span>
      <a href="#" class="nav-item active" data-page="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Dashboard
      </a>
    </div>
    <div class="nav-section">
      <span class="nav-section-label">Gestion</span>
      <a href="#" class="nav-item" data-page="clients">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Clients
        <span class="nav-badge" id="clientsBadge">0</span>
      </a>
      <a href="#" class="nav-item" data-page="projects">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
        Projets
        <span class="nav-badge" id="projectsBadge">0</span>
      </a>
    </div>
    <div class="nav-section">
      <span class="nav-section-label">Commercial</span>
      <a href="#" class="nav-item" data-page="quotes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        Devis
        <span class="nav-badge" id="quotesBadge">0</span>
      </a>
      <a href="#" class="nav-item" data-page="invoices">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
        Factures
        <span class="nav-badge" id="invoicesBadge">0</span>
      </a>
    </div>
    <div class="nav-section">
      <span class="nav-section-label">Communication</span>
      <a href="#" class="nav-item" data-page="messages">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Messages
        <span class="nav-badge" id="messagesBadge" style="background:#ef4444">0</span>
      </a>
    </div>
    <div class="nav-section">
      <span class="nav-section-label">Paramètres</span>
      <a href="#" class="nav-item" data-page="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Paramètres
      </a>
    </div>
  </nav>

  <a href="/" class="sidebar-footer-link">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    Voir le site vitrine
  </a>
</aside>

<!-- ===== MAIN ===== -->
<div class="admin-layout">
  <header class="admin-header">
    <button class="header-menu-btn" id="sidebarOpen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="header-title">
      <h1 id="pageTitle">Dashboard</h1>
      <span id="pageSubtitle">Vue d'ensemble</span>
    </div>
    <div class="header-actions">
      <button class="header-btn" id="headerActionBtn" style="display:none"></button>
    </div>
  </header>

  <main class="admin-main" id="adminMain">
    <!-- Content rendered by JS -->
  </main>
</div>

<!-- ===== MODAL ===== -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Titre</h2>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- ===== TOAST ===== -->
<div id="toast" class="toast"></div>

<!-- ===== CONFIRM ===== -->
<div class="modal-overlay" id="confirmOverlay" style="display:none">
  <div class="modal modal-sm">
    <div class="modal-header">
      <h2 id="confirmTitle">Confirmer</h2>
      <button class="modal-close" onclick="closeConfirm()">✕</button>
    </div>
    <div class="modal-body">
      <p id="confirmMsg" style="color:var(--text-light);margin-bottom:24px"></p>
      <div style="display:flex;gap:12px;justify-content:flex-end">
        <button class="btn-admin btn-admin-outline" onclick="closeConfirm()">Annuler</button>
        <button class="btn-admin btn-admin-danger" id="confirmBtn">Supprimer</button>
      </div>
    </div>
  </div>
</div>

<script src="/js/admin.js"></script>
</body>
</html>
